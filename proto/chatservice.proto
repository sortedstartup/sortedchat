syntax = "proto3";
import "google/protobuf/struct.proto";

package sortedchat;

option go_package = "sortedstartup/chatservice/proto";


service SortedChat {
    rpc Chat(ChatRequest) returns (stream ChatResponse);
    rpc GenerateChatName(GenerateChatNameRequest) returns (GenerateChatNameResponse);
    rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
    rpc GetChatList(GetChatListRequest) returns (GetChatListResponse);
    rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
    rpc SearchChat(ChatSearchRequest) returns (ChatSearchResponse);
    rpc ListModel(ListModelsRequest) returns (ListModelsResponse);

    rpc GetRAGDocumentReference (RAGDocumentReferenceRequest) returns (RAGDocumentReferenceResponse);
    rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);

    rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
    rpc GetProjects(GetProjectsRequest) returns (GetProjectsResponse);
    rpc ListDocuments(ListDocumentsRequest) returns(ListDocumentsResponse);
    rpc SubmitGenerateEmbeddingsJob(GenerateEmbeddingRequest) returns (GenerateEmbeddingResponse);

    rpc BranchAChat(BranchAChatRequest) returns (BranchAChatResponse);
    rpc ListChatBranch(ListChatBranchRequest) returns (ListChatBranchResponse);
    rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
    rpc RestoreChat(RestoreChatRequest) returns (RestoreChatResponse);
    rpc RenameItem(RenameItemRequest) returns (RenameItemResponse);
    rpc AddModel(AddModelRequest) returns (AddModelResponse);
}

message RenameItemRequest {
  string item_id = 1;
  string name = 2;
  ItemType item_type = 3;
  
  enum ItemType {
    CHAT = 0;
    PROJECT = 1;
  }
}
message RenameItemResponse {
  string message = 1;
}

message RestoreChatRequest {
  string chat_id = 1;
}
message RestoreChatResponse {
  string message = 1;
}

message DeleteChatRequest {
  string chat_id = 1;
  Operation operation = 2;
  enum Operation {
    DELETE = 0;
    SOFT_DELETE = 1;
  } 
}
message DeleteChatResponse {
  string message = 1;
}

message DeleteDocumentRequest {
  string project_id = 1;
  string doc_id = 2;
}

message DeleteDocumentResponse {
  string message = 1;
}

message RAGDocumentReferenceRequest{
  string message_id = 1;
  string project_id = 2;
  string docId = 3;  
}

message RAGDocumentReferenceResponse {
  RAGDocumentReference reference = 1;
}

service SettingService {
    rpc GetSetting(GetSettingRequest) returns (GetSettingResponse);
    rpc SetSetting(SetSettingRequest) returns (SetSettingResponse);
    rpc GetProviderSetting(GetProviderSettingRequest) returns (GetProviderSettingResponse);
    rpc SetProviderSetting(SetProviderSettingRequest) returns (SetProviderSettingResponse);
    rpc GetAllProviderSettings(GetAllProviderSettingsRequest) returns (GetAllProviderSettingsResponse);
    rpc SetAllProviderSettings(SetAllProviderSettingsRequest) returns (SetAllProviderSettingsResponse);
    rpc IsFirstBoot(IsFirstBootRequest) returns (IsFirstBootResponse);
    rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);  

}

enum ConnectionType {
    OLLAMA = 0;
    OPENAI = 1;
}

message TestConnectionRequest {
    string url = 1;
    ConnectionType connection_type = 2;
}

message TestConnectionResponse {
    bool success = 1;
    string message = 2;
}

message Settings {
   string OPENAI_API_KEY = 1;
   string OPENAI_API_URL = 2;
   string GEMINI_API_KEY = 3;
   string OLLAMA_URL = 4;
   string CLAUDE_API_URL = 5;
   string CLAUDE_API_KEY = 6;
   string GEMINI_API_URL = 7;
}

message GetSettingRequest {
    string name = 1;
}

message GetSettingResponse {
    google.protobuf.Struct settings = 1;
}

message SetSettingRequest {
    string name = 1;
    google.protobuf.Struct settings = 2;
}

message SetSettingResponse {
    string message = 1;
}

message ProviderSettings {
    string api_url = 1;
    // TODO: this is a bad design and the secret my be stored encrypte din the db backend, once we save its never to be shown again on the ui
    string api_key = 2;
    bool is_enabled = 3;
}

message GetProviderSettingRequest {
    string name = 1;
}

message GetProviderSettingResponse {
    ProviderSettings settings = 1;
}

message SetProviderSettingRequest {
    string name = 1;
    ProviderSettings settings = 2;
}

message SetProviderSettingResponse {
    string message = 1;
}

message AddModelRequest {
    string provider_name = 1;
    string model_id = 2;
    string model_name = 3;
    string url = 4;
    float input_token_cost = 5;
    float output_token_cost = 6;
    float cached_token_cost = 7;
    bool is_embedding_model = 8;
}

message AddModelResponse {
    string message = 1;
}

message GetAllProviderSettingsRequest {}

message GetAllProviderSettingsResponse {
    map<string, ProviderSettings> settings = 1;
}

message SetAllProviderSettingsRequest {
    map<string, ProviderSettings> settings = 1;
}

message SetAllProviderSettingsResponse {
    string message = 1;
}

message IsFirstBootRequest {}

message IsFirstBootResponse {
    bool is_first_boot = 1;
}



message CreateChatRequest {
  string name = 1;
  string project_id = 2;
}

message CreateChatResponse {
  string message = 1;
  string chat_id = 2;
}

message ProjectContext {
  string project_id = 1;
  bool rag_enabled = 2;
}

// Add new message types for multi-modal content
// MessageContent follows OpenAI Vision API format directly
message MessageContent {
  string type = 1;        // "text" or "image_url"
  
  // For text content (when type = "text")
  string text = 2;
  
  // For image content (when type = "image_url")
  ImageUrl image_url = 3;
}

message ImageUrl {
  string url = 1;      // data:image/jpeg;base64,... or URL
  string detail = 2;   // "low" | "high" | "auto" (OpenAI vision param)
                       // "auto": high for images >512x512, low otherwise
                       // "low": fixed token cost (fast, less detail)
                       // "high": tile-based calculation (slower, more detail)
}

message ChatRequest {
    string text = 1;                      // DEPRECATED: kept for backward compatibility
    string chatId = 2;
    string model = 3;
    ProjectContext project_context = 4;
    repeated MessageContent contents = 5;  // New: support multiple content pieces
    string provider = 6;
}

message ChatResponse {
  oneof response {
    string text = 1;
    // was introduced to send assistant message id, because it is generated server side
    // sending one of the multiple oneof's help us do all of this in one streaming API call
    ResponseSummary summary = 2;
    // message id of user message(question to llm)
    string request_message_id = 3;
    RAGDocumentReferenceSummaryList document_reference = 4; 
    ChatInfo chat_metadata = 5;
    ChatProgress progress = 6;
    ChatError error = 7;
  }
}

message ChatError {
  enum Type {
    PROVIDER_CONFIGURATION_ERROR = 0;
  }
  Type type = 1;
  string message = 2;
}

message ChatProgress {
  enum State {
    SENDING_REQUEST_TO_LLM = 0;
    REQUEST_SENT_TO_LLM = 1;
    FIRST_RESPONSE_RECEIVED = 2;
    FIRST_TOKEN_RECEIVED = 3;
    TOKENS_STREAMING = 4;
    TOKENS_STOPPED = 5;
  }

  State state = 1;
  string message = 2;
}

// TODO: reasonable limits from server side, limit to 10 (constant in server side) docs
message RAGDocumentReferenceSummaryList {
  repeated Summary summary = 1;
  message Summary {
    string doc_id = 1;
    string file_name = 2;
    int32 chunkCount = 3;
  }
}

message RAGDocumentReference {
  string doc_id = 1;
  string file_name = 2;
  repeated Chunk Chunks  = 3;
  message Chunk  {
    string chunk_text = 3;
    int32 start_byte = 4;
    int32 end_byte = 5;
    float simillarity = 6; 
  }
}

message ResponseSummary {
  string message_id = 1;
  string model = 2;
  int32 input_tokens = 3;
  int32 output_tokens = 4;
  int32 cached_tokens = 5;
  float cost = 6;
}

message GetHistoryRequest {
  string chatId = 1;
}

message GetHistoryResponse {
  repeated ChatMessage history = 1;
  ChatInfo chat_metadata = 2;
}

message ChatMessage {
  string role = 1;
  string content = 2;              // Keep for text-only (backward compat)
  string message_id = 3;
  repeated RAGDocumentReference references = 4;
  bool rag_enabled = 5;
  string model = 6;
  int32 input_tokens = 7;
  int32 output_tokens = 8;
  int32 cached_tokens = 9;
  float cost = 10;
  repeated MessageContent contents = 11;  // New: multi-modal content
}

message GetChatListRequest {
  string project_id = 1;
  bool soft_deleted = 2; 
  //later we create a filter object because we might have to add more filters
}

message GetChatListResponse {
  repeated ChatInfo chats = 1;
}

//total chat cost/token
message ChatInfo {
  string chatId = 1;
  string name = 2;
  float cost = 3;
  int32 input_token_count = 4;
  int32 output_token_count = 5;
  int32 cached_token_count = 6;
}

message ChatSearchRequest {
  string query = 1;
}

message SearchResult {
  string chat_name = 1;
  string chat_id = 2;
  string matched_text = 3;
}

message ChatSearchResponse {
  string query = 1;
  repeated SearchResult results = 2;
}

message CreateProjectRequest {
  string name = 1;
  string description = 2;
  string additional_data = 3; 
}

message CreateProjectResponse {
  string message = 1;
  string project_id = 2;
}

message GetProjectsRequest {}

message GetProjectsResponse {
  repeated Project projects = 1;
}

message Project {
  string id = 1;
  string name = 2;
  string description = 3;
  string additional_data = 4;
  string created_at = 5;
  string updated_at = 6;
}

message ListDocumentsRequest {
  string project_id = 1;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
}

message Document {
  int64 id = 1;
  string project_id = 2;
  string docs_id = 3;
  string file_name = 4;
  string created_at = 5;
  string updated_at = 6;
  Embedding_Status embedding_status=7;
}

enum Embedding_Status {
  STATUS_QUEUED = 0;
  STATUS_IN_PROGRESS = 1;
  STATUS_ERROR = 2;
  STATUS_SUCCESS = 3;
}

message GenerateEmbeddingRequest {
  string project_id = 1;
}

message GenerateEmbeddingResponse {
  string message = 1;
}

message GenerateChatNameRequest{
  string chat_id = 1;
  string message = 2; //first message in new chat
  string model = 3;
  string provider = 4;
}

message GenerateChatNameResponse {
  string chat_name = 1;
}

message BranchAChatRequest {
  string source_chat_id = 1;           // Chat to branch from
  string branch_from_message_id = 2;    // Message ID where branch starts
  string branch_name = 3;               // Optional name for new branch
}


message BranchAChatResponse {
  string message = 1;                   // Success/error message
  string new_chat_id = 2;              // ID of newly created branch
}

message ListChatBranchRequest {
  string chat_id = 1;
}

message ListChatBranchResponse {
  repeated ChatInfo branch_chat_list = 1;
}


message ModelListInfo {
  string id = 1;
  string label = 2;
  string provider = 3;
  string url = 4;
  float input_token_cost = 5;
  float output_token_cost = 6;
  ModelCapabilities capabilities = 7;
  bool is_downloaded = 8;
  bool is_downloadable = 9;
  bool is_embedding_model = 10;
  float cached_token_cost = 11;
}

message ModelCapabilities {
  Capability text = 1;
  Capability audio = 2;
  Capability video = 3;
  Capability image = 4;
  bool realtime = 5;
  bool support_tool_calling = 6;
}

message Capability {
  bool input = 1;
  bool output = 2;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated ModelListInfo models = 1;
}


