<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full mx-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">OAuth POC</h1>
            <p class="text-gray-600">Simple Google OAuth + OIDC Demo</p>
        </div>

        {{if .error}}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-6">
            <strong>Error:</strong> {{.error}}
        </div>
        {{end}}

        <div class="space-y-4">
            <button 
                hx-get="/login"
                hx-trigger="click"
                class="w-full bg-white border border-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-lg shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 flex items-center justify-center space-x-3"
            >
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                <span>Login with Google</span>
            </button>

            <div class="text-center">
                <p class="text-sm text-gray-500">
                    Secure OAuth 2.0 + OpenID Connect authentication
                </p>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-gray-200">
            <div class="text-xs text-gray-500 space-y-1">
                <p><strong>Setup:</strong></p>
                <p>1. Set GOOGLE_CLIENT_ID env var</p>
                <p>2. Set GOOGLE_CLIENT_SECRET env var</p>
                <p>3. Configure redirect URI: http://localhost:8080/callback</p>
            </div>
        </div>
    </div>

    <script>
        // HTMX configuration for redirects
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            if (evt.detail.elt.getAttribute('hx-get') === '/login') {
                // Allow the browser to handle the redirect
                window.location.href = '/login';
                evt.preventDefault();
            }
        });
    </script>
</body>
</html>
