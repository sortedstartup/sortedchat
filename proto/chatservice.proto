// MCP Server Configuration
message MCPServer {
  string server_name = 1;
  bool is_enabled = 2;
  
  oneof transport {
    MCPStdio stdio = 3;
    MCPHttp http = 4;
  }
}

message MCPStdio {
  string command = 1;
  repeated string arguments = 2;
  map<string, string> environment_variables = 3;
}

message MCPHttp {
  string url = 1;
  map<string, string> headers = 2;
  int32 timeout_seconds = 3;
}

message CreateAgentRequest {
  string name = 1;

  // not mandatory
  string description = 2;

  string system_prompt = 3;

  string provider = 5;
  string model = 4;

  repeated string local_tools = 6;
  
  repeated MCPServer mcp_servers = 7;
}

message Agent {
  // metadata
  string id = 1;
  string name = 2;
  string description = 3;

  // configuration
  string system_prompt = 4;

  string provider = 5;
  string model = 6;

  // later configuration per LLM, temperature, max_tokens, etc.
  /*
    float temperature = 7;
    int32 max_tokens = 8;
    int32 top_p = 9;
    int32 frequency_penalty = 10;
    int32 presence_penalty = 11;
    int32 n = 12;
    int32 best_of = 13;
  */

  // tools
  repeated string local_tools = 8;
 // repeated string remote_tools = 9;
  
  repeated MCPServer mcp_servers = 10;
}

message CreateAgentResponse {
  string message = 1;
  string agent_id = 2;
}

message GetAgentsRequest {}

message GetAgentsResponse {
  repeated Agent agents = 1;
}

message UpdateAgentRequest {
  string agent_id = 1;
  string name = 2;
  string description = 3;
  string system_prompt = 4;
  string provider = 5;
  string model = 6;
  repeated MCPServer mcp_servers = 7;
}

message UpdateAgentResponse {
  string message = 1;
}

message CreateSessionRequest {
  string agent_id = 1;
}

message CreateSessionResponse {
  string message = 1;
  string session_id = 2;
}

message AgentChatRequest {
  string session_id = 1;
  string message = 2;
}

message AgentChatResponse {
  oneof response {
    ContentEvent content = 1;
    ToolCall tool_call = 2;
    ToolResult tool_result = 3;
    AgentChatError error = 4;
  }
}

message AgentChatError {
  enum Type {
    UNKNOWN = 0;
    MODEL_LOADING = 1;
    PROVIDER_ERROR = 2;
  }
  Type type = 1;
  string message = 2;
  int32 code = 3;
}

// Generic content output (text, thinking, images, video, etc.)
message ContentEvent {
  string type = 1;            // "text", "thinking", "image", "video", "audio"
  string text = 2;            // for text/thinking content
  string url = 3;             // for media (image/video/audio URL or base64)
  string mime_type = 4;       // e.g., "image/png", "video/mp4"
  string phase = 5;           // for thinking: "before_model", "after_model", "before_tool", "after_tool"
  string model = 6;           // which model generated this
}

// Tool being called (sent BEFORE execution)
message ToolCall {
  string id = 1;              // unique ID to correlate with ToolResult
  string name = 2;            // tool name
  string arguments_json = 3;  // JSON string of arguments
}

// Tool finished (sent AFTER execution)
message ToolResult {
  string id = 1;              // matches ToolCall.id
  string name = 2;            // tool name
  string result_json = 3;     // JSON string of result
  bool success = 4;           // true if tool executed successfully
  string error_message = 5;   // populated if success=false
  int64 duration_ms = 6;      // execution time in milliseconds
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message Session {
  string id = 1;
  string agent_id = 2;
}

message GetSessionsRequest {
  string agent_id = 1;
}

message GetSessionsResponse {
  repeated Session sessions = 1;
}

message GetAgentMessagesRequest {
  string session_id = 1;
}

message GetAgentMessagesResponse {
  repeated AgentMessage messages = 1;
}

message AgentMessage {
  string id = 1;
  string session_id = 2;
  int32 sequence_number = 3;
  string role = 4;
  string type = 5;
  string content = 6;
  string tool_name = 7;
  string tool_call_id = 8;
  string tool_args = 9;
  bool success = 10;
  string error_message = 11;
  int64 run_time_ms = 12;
  string thought_signature = 13;
}

message GetAgentMessageRequest {
  string message_id = 1;
}

message GetAgentMessageResponse {
  AgentMessage message = 1;
}

