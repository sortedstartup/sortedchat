message CreateAgentRequest {
  string name = 1;

  // not mandatory
  string description = 2;

  string system_prompt = 3;

  string provider = 5;
  string model = 4;

  repeated string local_tools = 6;
}

message Agent {
  // metadata
  string id = 1;
  string name = 2;
  string description = 3;

  // configuration
  string system_prompt = 4;

  string provider = 5;
  string model = 6;

  // later configuration per LLM, temperature, max_tokens, etc.
  /*
    float temperature = 7;
    int32 max_tokens = 8;
    int32 top_p = 9;
    int32 frequency_penalty = 10;
    int32 presence_penalty = 11;
    int32 n = 12;
    int32 best_of = 13;
  */

  // tools
  repeated string local_tools = 8;
 // repeated string remote_tools = 9;
}

message CreateAgentResponse {
  string message = 1;
  string agent_id = 2;
}

message GetAgentsRequest {}

message GetAgentsResponse {
  repeated Agent agents = 1;
}

message CreateSessionRequest {
  string agent_id = 1;
}

message CreateSessionResponse {
  string message = 1;
  string session_id = 2;
}

message AgentChatRequest {
  string session_id = 1;
  string message = 2;
}

message AgentChatResponse {
  oneof response {
    string message = 1;
    string thinking = 2;
    string tool_call = 3;
    string tool_result = 4;
    string error = 5;
  }
}

message GetSessionRequest {
  string session_id = 1;
}

message GetSessionResponse {
  Session session = 1;
}

message Session {
  string id = 1;
  string agent_id = 2;
}

message GetSessionsRequest {}

message GetSessionsResponse {
  repeated Session sessions = 1;
}

message GetAgentMessagesRequest {
  string session_id = 1;
}

message GetAgentMessagesResponse {
  repeated AgentMessage messages = 1;
}

message AgentMessage {
  string id = 1;
  string session_id = 2;
  int32 sequence_number = 3;
  string role = 4;
  string type = 5;
  string content = 6;
  string tool_name = 7;
  string tool_call_id = 8;
  string tool_args = 9;
}

message GetAgentMessageRequest {
  string message_id = 1;
}

message GetAgentMessageResponse {
  AgentMessage message = 1;
}


